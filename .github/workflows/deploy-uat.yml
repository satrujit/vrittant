name: Deploy to UAT

on:
  push:
    branches: [develop]

jobs:
  # ─── Run Tests First ───
  tests:
    uses: ./.github/workflows/ci.yml

  # ─── Deploy API to Hetzner (UAT) ───
  deploy-api:
    name: Deploy API → Hetzner UAT
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync API code to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='node_modules' --exclude='mobile' --exclude='reviewer-panel'
          path: api/
          remote_path: /opt/vrittant/api-uat/
          remote_host: 162.55.209.90
          remote_user: root
          remote_key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Sync widgets code to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='__pycache__' --exclude='*.pyc'
          path: widgets/
          remote_path: /opt/vrittant/widgets/
          remote_host: 162.55.209.90
          remote_user: root
          remote_key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Build and restart
        uses: appleboy/ssh-action@v1
        with:
          host: 162.55.209.90
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /opt/vrittant

            # Build new images (doesn't touch running containers)
            docker compose build api-uat
            docker compose --profile jobs build widget-fetcher

            # Graceful deploy: finish in-flight requests before stopping
            OLD_CONTAINER=$(docker compose ps -q api-uat)
            if [ -n "$OLD_CONTAINER" ]; then
              echo "Gracefully stopping old container..."
              docker compose stop -t 30 api-uat
            fi

            # Start new container
            docker compose up -d api-uat
            sleep 5
            docker compose ps
            curl -sf http://127.0.0.1:8081/version/min-supported > /dev/null && echo "✅ UAT API healthy" || (echo "❌ UAT API unhealthy" && docker compose logs api-uat --tail 20 && exit 1)

            # Clean up old image layers
            docker image prune -f > /dev/null 2>&1

  # ─── Deploy Frontend to Firebase (UAT) ───
  deploy-panel:
    name: Deploy Panel → UAT
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reviewer-panel/package-lock.json

      - name: Install & Build (UAT)
        working-directory: reviewer-panel
        run: |
          npm ci
          npm install -g firebase-tools
          npx vite build --mode uat

      - name: Deploy to Firebase (UAT site)
        working-directory: reviewer-panel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only hosting:uat --project vrittant-f5ef2
