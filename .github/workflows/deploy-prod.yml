name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # ─── Run Tests First ───
  tests:
    uses: ./.github/workflows/ci.yml

  # ─── Deploy API to Hetzner (Production) ───
  deploy-api:
    name: Deploy API → Hetzner Production
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='node_modules' --exclude='mobile' --exclude='reviewer-panel'
          path: api/
          remote_path: /opt/vrittant/api/
          remote_host: 162.55.209.90
          remote_user: root
          remote_key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Build and restart
        uses: appleboy/ssh-action@v1
        with:
          host: 162.55.209.90
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /opt/vrittant
            docker compose build api
            docker compose up -d api
            sleep 5
            docker compose ps
            curl -sf http://127.0.0.1:8080/version/min-supported > /dev/null && echo "✅ API healthy" || (echo "❌ API unhealthy" && docker compose logs api --tail 20 && exit 1)

  # ─── Deploy Frontend to Firebase (Production) ───
  deploy-panel:
    name: Deploy Panel → Production
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reviewer-panel/package-lock.json

      - name: Install & Build (Production)
        working-directory: reviewer-panel
        run: |
          npm ci
          npm install -g firebase-tools
          npx vite build --mode production

      - name: Deploy to Firebase (Production)
        working-directory: reviewer-panel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only hosting:production --project vrittant-f5ef2
